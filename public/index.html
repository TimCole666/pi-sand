<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>pi-sand</title>
  <style>
    :root{font:16px system-ui,sans-serif;color:#e7eaf0;background:#17191d}
    *{box-sizing:border-box}body{min-height:100vh;max-width:1200px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:auto 1fr;gap:1rem}
    h1{font-size:1.4rem;grid-column:1/-1;margin:.5rem 0}h2{font-size:1rem;margin:.5rem 0}
    section{min-width:0}#setup{border-right:1px solid #30343c;padding-right:1rem}#conversation{padding:0 1rem;display:flex;flex-direction:column;min-height:70vh}
    form{display:flex;gap:.5rem;margin:1rem 0}input,button,select{font:inherit;padding:.6rem;border-radius:6px;border:1px solid #454b55;background:#23262c;color:inherit}input{flex:1}button{cursor:pointer}select{width:100%}
    #agents{margin-top:.5rem}.agent-list{display:flex;flex-direction:column;gap:.35rem;margin:.75rem 0}.agent-row{width:100%;display:flex;align-items:center;gap:.65rem;text-align:left;background:transparent;border-color:transparent;padding:.55rem}.agent-row:hover,.agent-row.selected{background:#292d34;border-color:#454b55}.agent-marker{display:grid;place-items:center;flex:none;width:2rem;height:2rem;border-radius:50%;background:#3a4d69;color:#dbe9ff;font-weight:700}.agent-row-copy{display:flex;min-width:0;flex-direction:column;gap:.15rem}.agent-row-copy strong,.agent-row-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agent-row-copy small{color:#9da5b2;font-size:.8rem}
    #messages{display:flex;flex:1;flex-direction:column;gap:.75rem;overflow:auto}.message{padding:.8rem 1rem;border-radius:8px;white-space:pre-wrap}.user{background:#2e405e}.assistant{background:#292d34}.running{color:#9cc6ff}.error{color:#ff9a9a}.connecting,.reconnecting{color:#9cc6ff}.connection{min-height:1.4rem;color:#ffcc80}.meta{color:#9da5b2;font-size:.85rem}#send{margin-top:1rem}#send input{min-width:0}
    .hidden{display:none}@media(max-width:700px){body{display:block;padding:.75rem}#setup{border-right:0;border-bottom:1px solid #30343c;padding:0 0 1rem;margin-bottom:1rem}#conversation{padding:0;min-height:60vh}}
  </style>
</head>
<body>
  <h1>pi-sand</h1>
  <section id="setup">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem"><h2>Agents</h2><button type="button" id="new-chat">New chat</button></div>
    <form id="create">
      <input id="name" name="name" placeholder="Agent name" value="Agent" aria-label="Agent name">
      <input id="workspace" name="workspace" placeholder="Workspace path" required aria-label="Workspace path">
      <button>Create</button>
    </form>
    <div id="agent-list" class="agent-list" aria-label="Saved Agents"></div>
    <select id="agents" aria-label="Open an existing Agent"><option value="">Open an existing Agent…</option></select>
    <p id="empty-state" hidden>No saved agents yet.</p>
    <p id="connection" class="connection" hidden></p>
    <button type="button" id="retry" hidden>Retry</button>
  </section>
  <section id="conversation" hidden>
    <p class="meta" id="agent-meta"></p>
    <div id="messages"></div>
    <p id="status"></p>
    <form id="send">
      <input id="message" name="message" placeholder="Ask Pi to work…" autocomplete="off" required>
      <button id="send-submit" type="submit">Send</button>
      <button type="button" id="interrupt" hidden>Interrupt</button>
    </form>
  </section>
  <script type="module" src="/app.js"></script>
</body>
</html>
