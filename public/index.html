<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pi-sand</title><style>
:root{font:16px system-ui,sans-serif;color:#e7eaf0;background:#17191d}body{max-width:900px;margin:0 auto;padding:2rem}h1{font-size:1.4rem}form{display:flex;gap:.5rem;margin:1rem 0}input,button{font:inherit;padding:.6rem;border-radius:6px;border:1px solid #454b55;background:#23262c;color:inherit}input{flex:1}button{cursor:pointer}#messages{display:flex;flex-direction:column;gap:.75rem}.message{padding:.8rem 1rem;border-radius:8px;white-space:pre-wrap}.user{background:#2e405e}.assistant{background:#292d34}.running{color:#9cc6ff}.error{color:#ff9a9a}.meta{color:#9da5b2;font-size:.85rem}
</style></head><body><h1>pi-sand</h1><section id="setup"><p>Create an Agent</p><form id="create"><input name="name" placeholder="Agent name" value="Agent"><input name="workspace" placeholder="Workspace path" required><button>Create</button></form><select id="agents"><option value="">Open an existing Agent…</option></select></section><section id="conversation" hidden><p class="meta" id="agent-meta"></p><div id="messages"></div><p id="status"></p><form id="send"><input name="message" placeholder="Ask Pi to work…" autocomplete="off" required><button>Send</button><button type="button" id="interrupt" hidden>Interrupt</button></form></section><script type="module" src="/app.js"></script></body></html>
