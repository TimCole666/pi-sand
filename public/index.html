<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pi-sand</title><style>
:root{font:16px system-ui,sans-serif;color:#e7eaf0;background:#17191d}body{max-width:900px;margin:0 auto;padding:2rem}h1{font-size:1.4rem}form{display:flex;gap:.5rem;margin:1rem 0}input,button{font:inherit;padding:.6rem;border-radius:6px;border:1px solid #454b55;background:#23262c;color:inherit}input{flex:1}button{cursor:pointer}#messages{display:flex;flex-direction:column;gap:.75rem}.message{padding:.8rem 1rem;border-radius:8px;white-space:pre-wrap}.user{background:#2e405e}.assistant{background:#292d34}.running{color:#9cc6ff}.error{color:#ff9a9a}.meta{color:#9da5b2;font-size:.85rem}
</style></head><body><h1>pi-sand</h1><section id="setup"><p>Create an Agent</p><form id="create"><input name="name" placeholder="Agent name" value="Agent"><input name="workspace" placeholder="Workspace path" required><button>Create</button></form><select id="agents"><option value="">Open an existing Agent…</option></select></section><section id="conversation" hidden><p class="meta" id="agent-meta"></p><div id="messages"></div><p id="status"></p><form id="send"><input name="message" placeholder="Ask Pi to work…" autocomplete="off" required><button>Send</button><button type="button" id="interrupt" hidden>Interrupt</button></form></section><script>
const $=s=>document.querySelector(s);let agent=null,source=null;
async function request(url, options){const response=await fetch(url,{headers:{'content-type':'application/json'},...options});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
async function refreshAgents(){const agents=await request('/api/agents');$('#agents').innerHTML='<option value="">Open an existing Agent…</option>'+agents.map(a=>`<option value="${a.id}">${a.name} — ${a.workspace}</option>`).join('')}
function render(snapshot){agent=snapshot.agent;$('#setup').hidden=false;$('#conversation').hidden=false;$('#agent-meta').textContent=`${agent.name} · ${agent.workspace}`;$('#messages').innerHTML=snapshot.messages.map(m=>`<div class="message ${m.role}" data-id="${m.id}">${escapeHtml(m.content)}</div>`).join('');$('#status').textContent=snapshot.state==='active'?'Pi is working…':'';const active=snapshot.activeTurnId;$('#interrupt').hidden=!active}
function escapeHtml(value){return value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function openAgent(id){if(source)source.close();const snapshot=await request('/api/agents/'+id);localStorage.setItem('pi-sand-agent',id);render(snapshot);source=new EventSource('/api/agents/'+id+'/events');source.onmessage=e=>{const event=JSON.parse(e.data);if(event.snapshot)render(event.snapshot)}}
$('#create').onsubmit=async e=>{e.preventDefault();try{const data=await request('/api/agents',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await refreshAgents();await openAgent(data.agent.id)}catch(err){alert(err.message)}};
$('#agents').onchange=e=>e.target.value&&openAgent(e.target.value).catch(err=>alert(err.message));$('#send').onsubmit=async e=>{e.preventDefault();if(!agent)return;const input=e.target.message;try{await request('/api/agents/'+agent.id+'/turns',{method:'POST',body:JSON.stringify({message:input.value})});input.value=''}catch(err){alert(err.message)}};$('#interrupt').onclick=async()=>{const active=(await request('/api/agents/'+agent.id)).activeTurnId;if(active)await request('/api/agents/'+agent.id+'/interrupt',{method:'POST',body:JSON.stringify({turnId:active})})};refreshAgents().then(async()=>{const remembered=localStorage.getItem('pi-sand-agent');if(remembered&&[...$('#agents').options].some(o=>o.value===remembered)){$('#agents').value=remembered;await openAgent(remembered)}}).catch(err=>alert(err.message));
</script></body></html>
